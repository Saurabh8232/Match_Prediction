<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPL Live Prediction</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

 
  <a href="index.html" class="back-btn">⟵ Back</a>

 
  <section class="team-section">
    <h1> Live Match Prediction 🏏</h1>

    <div class="team-container">

     
      <div class="team-card" style="width:100%; max-width:900px; margin:auto;">

        <h2 style="margin-bottom:20px;">Enter Match Details</h2>

        <div class="form-row">
          <div class="form-field">
            <label>Batting Team</label>
            <select>
             <option value="">-- Select Batting Team --</option>
    <option value="Chennai Super Kings">Chennai Super Kings (CSK)</option>
    <option value="Mumbai Indians">Mumbai Indians (MI)</option>
    <option value="Royal Challengers Bangalore">Royal Challengers Bangalore (RCB)</option>
    <option value="Kolkata Knight Riders">Kolkata Knight Riders (KKR)</option>
    <option value="Rajasthan Royals">Rajasthan Royals (RR)</option>
    <option value="Sunrisers Hyderabad">Sunrisers Hyderabad (SRH)</option>
    <option value="Delhi Capitals">Delhi Capitals (DC)</option>
    <option value="Punjab Kings">Punjab Kings (PBKS)</option>
    <option value="Gujarat Titans">Gujarat Titans (GT)</option>
    <option value="Lucknow Super Giants">Lucknow Super Giants (LSG)</option>
            </select>
           
<div class="form-row" style="padding-top: 10px;">
  <div class="form-field">
    <label for="venue"> Venue</label>
<select name="venue" id="venue" required>
  <option value="">-- Select Stadium --</option>
  <option value="Rajiv Gandhi Stadium">Rajiv Gandhi Stadium</option>
  <option value="Wankhede Stadium">Wankhede Stadium</option>
  <option value="Sawai Mansingh Stadium">Sawai Mansingh Stadium</option>
  <option value="Arun Jaitley Stadium">Arun Jaitley Stadium</option>
  <option value="Narendra Modi Stadium">Narendra Modi Stadium</option>
  <option value="Chinnaswamy Stadium">Chinnaswamy Stadium</option>
  <option value="Eden Gardens">Eden Gardens</option>
  <option value="Chepauk Stadium">Chepauk Stadium</option>
</select>
  </div>


</div>

          </div>

          <div class="form-field">
            <label> Bowling Team</label>
            <select>
              <option value="">-- Select Bowling Team --</option>
    <option value="Chennai Super Kings">Chennai Super Kings (CSK)</option>
    <option value="Mumbai Indians">Mumbai Indians (MI)</option>
    <option value="Royal Challengers Bangalore">Royal Challengers Bangalore (RCB)</option>
    <option value="Kolkata Knight Riders">Kolkata Knight Riders (KKR)</option>
    <option value="Rajasthan Royals">Rajasthan Royals (RR)</option>
    <option value="Sunrisers Hyderabad">Sunrisers Hyderabad (SRH)</option>
    <option value="Delhi Capitals">Delhi Capitals (DC)</option>
    <option value="Punjab Kings">Punjab Kings (PBKS)</option>
    <option value="Gujarat Titans">Gujarat Titans (GT)</option>
    <option value="Lucknow Super Giants">Lucknow Super Giants (LSG)</option>
            </select>
              <div class="form-field" style="padding-top: 10px;">

                
    <label for="pitch_condition">Pitch Condition</label>
<select name="pitch_condition" id="pitch_condition" required>
  <option value="">-- Select Pitch Condition --</option>
  <option value="Dry">Dry</option>
  <option value="Dusty">Dusty</option>
  <option value="Flat">Flat</option>
  <option value="Green">Green</option>
  <option value="Hard">Hard</option>
</select>
</select>
  </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label>Score</label>
            <input type="number" min="1" placeholder="45">
          </div>

          <div class="form-field">
            <label>Overs Completed</label>
            <input type="number" step="0.1" min="1" placeholder="2" max="20">
          </div>

          <div class="form-field">
            <label>Wickets Out</label>
            <input type="number" min="0" placeholder="3" max="10">
          </div>
        </div>

        <div class="form-row single">
          <div class="form-field full">
            <label>Runs in Last 5 Overs</label>
            <input type="number" min="1" placeholder="25">
          </div>
        </div>

        <button class="predict-btn">Predict Score</button>

      </div>

    </div>
  </section>

  <script>

document.querySelector(".predict-btn").addEventListener("click", async () => {

const data = {
batting_team: document.getElementById("batting_team").value,
bowling_team: document.getElementById("bowling_team").value,
venue: document.getElementById("venue").value,
pitch_condition: "Flat",
current_score: document.getElementById("score").value,
overs_completed: document.getElementById("overs").value,
wickets_out: document.getElementById("wickets").value,
runs_last_5_overs: document.getElementById("runs_last5").value,
overs_remaining: 20 - document.getElementById("overs").value,
run_rate: document.getElementById("score").value / document.getElementById("overs").value
}

const response = await fetch("/predict",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body: JSON.stringify(data)
})

const result = await response.json()

alert("Predicted Score : " + result.predicted_score)

})


















const pitchMap = {
  "Rajiv Gandhi Stadium": "Dry",
  "Wankhede Stadium": "Flat",
  "Sawai Mansingh Stadium": "Dry",
  "Arun Jaitley Stadium": "Dusty",
  "Narendra Modi Stadium": "Hard",
  "Chinnaswamy Stadium": "Flat",
  "Eden Gardens": "Green",
  "Chepauk Stadium": "Dusty"
};

document.getElementById("venue").addEventListener("change", function() {
  let selectedVenue = this.value;
  let pitch = pitchMap[selectedVenue];

  if(pitch){
    document.getElementById("pitch_condition").value = pitch;
  }
});


</script>
</body>
</html>
